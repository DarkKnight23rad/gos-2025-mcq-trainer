<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ГОС 2025 — тренажёр</title>
  <style>
    :root {
      --bg: #f3f5f4;
      --panel: #fff;
      --ink: #17202d;
      --muted: #647084;
      --line: #d7dde3;
      --accent: #0b6e69;
      --good: #08783f;
      --good-soft: #e9f8ef;
      --bad: #b42318;
      --bad-soft: #fff0ef;
      --focus: #7b3fa0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); }
    .header-inner { width: min(1180px,100%); margin: 0 auto; padding: 14px 20px; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 18px; }
    h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .chips { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .chip { min-height: 34px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fafbfb; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .layout { width: min(1180px,100%); margin: 0 auto; padding: 18px 20px 34px; display: grid; grid-template-columns: minmax(0,1fr) 270px; gap: 16px; }
    .tools { margin-bottom: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); display: grid; grid-template-columns: minmax(180px,1fr) 140px 140px auto; gap: 8px; }
    input, select, .tool-button, .nav-button { min-height: 42px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
    input, select { width: 100%; padding: 0 11px; }
    .tool-button, .nav-button { padding: 0 13px; font-weight: 700; }
    .quiz { min-height: 520px; padding: clamp(18px,3vw,28px); border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .meta { margin-bottom: 16px; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }
    .image-badge { color: var(--focus); font-weight: 700; }
    .question { margin: 0 0 18px; font-size: clamp(19px,2.2vw,27px); line-height: 1.38; letter-spacing: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .media { display: grid; gap: 10px; margin-bottom: 18px; }
    .media button { padding: 0; border: 1px solid var(--line); border-radius: 8px; background: #111820; overflow: hidden; }
    .media img { display: block; width: 100%; max-height: 620px; object-fit: contain; }
    .answers { display: grid; gap: 10px; counter-reset: answers; }
    .answer { counter-increment: answers; min-height: 54px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 7px; background: #fafbfc; color: var(--ink); text-align: left; line-height: 1.38; white-space: normal; overflow-wrap: anywhere; }
    .answer::before { content: counter(answers, upper-alpha) ". "; color: var(--muted); font-weight: 700; }
    .answer:hover { border-color: var(--accent); background: #f4faf9; }
    .answer.correct { border-color: var(--good); background: var(--good-soft); color: var(--good); }
    .answer.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
    .feedback { min-height: 28px; margin-top: 12px; font-weight: 700; line-height: 1.4; }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .nav-button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    aside { align-self: start; padding: 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    aside h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 0; }
    .progress-track { height: 8px; border-radius: 4px; background: #e7ebee; overflow: hidden; }
    .progress-fill { width: 0; height: 100%; background: var(--accent); transition: width .2s ease; }
    .metric { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .metric:last-child { border-bottom: 0; }
    .metric span { color: var(--muted); }
    dialog { width: min(96vw,1200px); max-height: 94vh; padding: 10px; border: 0; border-radius: 8px; background: #0f151c; }
    dialog::backdrop { background: rgba(9,14,20,.78); }
    dialog img { display: block; width: 100%; max-height: calc(94vh - 20px); object-fit: contain; }
    @media (max-width: 820px) {
      .header-inner, .layout, .tools { grid-template-columns: 1fr; }
      .chips { justify-content: flex-start; }
      aside { order: -1; }
      .layout { padding: 12px; }
      .quiz { min-height: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div><h1>ГОС 2025</h1><div class="subtitle">Тренажёр с вариантами и снимками</div></div>
      <div class="chips"><span class="chip" id="totalChip"></span><span class="chip" id="stageChip"></span><span class="chip" id="scoreChip"></span></div>
    </div>
  </header>
  <main class="layout">
    <section>
      <div class="tools">
        <input id="search" type="search" placeholder="Поиск по вопросу или ответу" aria-label="Поиск">
        <select id="stage" aria-label="Этап"><option value="all">Оба этапа</option><option value="1 этап">1 этап</option><option value="2 этап">2 этап</option></select>
        <select id="filter" aria-label="Фильтр"><option value="all">Все вопросы</option><option value="unseen">Непройденные</option><option value="mistakes">С ошибками</option><option value="images">Со снимками</option></select>
        <button class="tool-button" id="shuffle">Перемешать</button>
      </div>
      <article class="quiz">
        <div class="meta"><span id="position"></span><span id="badge"></span></div>
        <p class="question" id="question"></p>
        <div class="media" id="media"></div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
        <div class="actions"><button class="nav-button" id="prev">Назад</button><button class="nav-button primary" id="next">Дальше</button><button class="nav-button" id="show">Показать ответ</button><button class="nav-button" id="reset">Сбросить прогресс</button></div>
      </article>
    </section>
    <aside>
      <h2>Прогресс</h2>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="metric"><span>Пройдено</span><strong id="seen">0</strong></div>
      <div class="metric"><span>Верно</span><strong id="right">0</strong></div>
      <div class="metric"><span>Ошибки</span><strong id="wrong">0</strong></div>
      <div class="metric"><span>Со снимками</span><strong>7</strong></div>
      <div class="metric"><span>1 этап</span><strong>146</strong></div>
      <div class="metric"><span>2 этап</span><strong>60</strong></div>
    </aside>
  </main>
  <dialog id="imageDialog"><img id="dialogImage" alt="Увеличенный снимок"></dialog>

ets_web/image_0d39efb6ed4e.webp"],"options_source":"curated_image_match","image_match":{"astana_id":22,"question":"Для какой патологии органов грудной клетки НАИБОЛЕЕ характерны изменения на представленной обзорной рентгенограмме органов грудной клетки:","answer":"пневмотракс"}},{"id":101,"stage":"1 этап","source":"Гос 1 этап 2025.docx","question":"Пациент 14 лет. На рентгенограмме шейного отдела позвоночника в двух проекциях ось позвоночника незначительно искривлена в шейном и верхнегрудном отделах влево. Физиологический кифоз выпрямлен. Определяется клиновидная деформация тела С5 позвонка с признаками нарушения целостности верхней и нижней замыкательных пластин. Межпозвонковые щели на уровне С4–С5 и С5–С6 снижены. Костномозговой канал не сужен. Ваше заключение:","answer":"Компрессионный перелом С5 позвонка","options":["Врожденная клиновидная деформация тела С5 позвонка","Умеренный левосторонний сколиоз шейного и верхнегрудного отделов позвоночника","Болезнь Кальве С5","Остеохондропатия тела С5 позвонка","Компрессионный перелом С5 позвонка"],"correct_index":4,"images":[],"options_source":"related_astana_2020","image_match":null},{"id":102,"stage":"1 этап","source":"Гос 1 этап 2025.docx","question":"Ребёнок, 6 лет. Жалобы со слов мамы на кашель, ощущения жара, общее недомогание. Болен 3 дня. Частота дыхания – 32 в минуту. При аускультации дыхание в нижних отделах слева ослаблено. Выполнена обзорная рентгенография органов грудной клетки в прямой проекции и дополнительная левая боковая рентгенография. На рентгенограмме выявляется негомогенное затемнение на уровне 9, 10 сегментов левого лёгочного поля средней интенсивности, с нечёткими контурами. Диафрагма расположена обычно. Ваше заключение:","answer":"Полисегментарная пневмония нижней доли левого лёгкого","options":["Левая боковая","Правая косая","Полисегментарная пневмония нижней доли левого лёгкого","Боковая правая","Экссудативный плеврит слева"],"correct_index":2,"images":[],"options_source":"related_astana_2020",       buttons.forEach((button,index) => { if (index === card.correct_index) button.classList.add("correct"); if (index === selected && selected !== card.correct_index) button.classList.add("wrong"); });
      const state = progress[card.id] || {right:0,wrong:0,seen:false}; state.seen = true;
      if (selected === card.correct_index) { state.right = (state.right || 0) + 1; $("feedback").textContent = "Верно"; $("feedback").className = "feedback good"; }
      else { state.wrong = (state.wrong || 0) + 1; $("feedback").textContent = `Неверно. Правильный ответ: ${card.answer}`; $("feedback").className = "feedback bad"; }
      progress[card.id] = state; save(); renderStats();
    }
    $("show").onclick = () => { if (!order.length) return; const card = cards[order[current]]; [...document.querySelectorAll(".answer")].forEach((button,index) => { if (index === card.correct_index) button.classList.add("correct"); }); const state = progress[card.id] || {right:0,wrong:0,seen:false}; state.seen = true; progress[card.id] = state; save(); $("feedback").textContent = `Правильный ответ: ${card.answer}`; $("feedback").className = "feedback good"; renderStats(); };
    $("next").onclick = () => { if (order.length) { current = (current + 1) % order.length; render(); } };
    $("prev").onclick = () => { if (order.length) { current = (current - 1 + order.length) % order.length; render(); } };
    $("shuffle").onclick = () => { shuffleArray(order); current = 0; render(); };
    $("reset").onclick = () => { progress = {}; save(); render(); };
    $("search").oninput = rebuild; $("stage").onchange = rebuild; $("filter").onchange = rebuild;
    $("imageDialog").onclick = event => { if (event.target === $("imageDialog")) $("imageDialog").close(); };
    document.addEventListener("keydown", event => { if (event.target.matches("input,select")) return; if (event.key === "ArrowRight") $("next").click(); if (event.key === "ArrowLeft") $("prev").click(); if (/^[1-5]$/.test(event.key)) { const button = document.querySelectorAll(".answer")[Number(event.key) - 1]; if (button) button.click(); } });
    rebuild();
  </script>
</body>
</html>
