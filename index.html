<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ГОС 2025 тест с вариантами</title>
  <style>
    :root {
      --bg: #f4f6f3;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d7dde7;
      --accent: #0f766e;
      --good: #067647;
      --bad: #b42318;
      --soft: #e7f4f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 18px clamp(14px, 3vw, 34px);
    }
    .top {
      max-width: 1140px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.1;
      letter-spacing: 0;
    }
    .pills { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      background: #fbfcfd;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    main {
      max-width: 1140px;
      margin: 0 auto;
      padding: 18px clamp(14px, 3vw, 34px) 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 16px;
    }
    .toolbar, .quiz, .side {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .toolbar {
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 140px 120px 120px;
      gap: 8px;
      margin-bottom: 12px;
    }
    input, select, button {
      font: inherit;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--ink);
    }
    input, select { padding: 0 10px; min-width: 0; }
    button { padding: 0 12px; font-weight: 700; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .quiz { padding: clamp(16px, 3vw, 26px); min-height: 480px; }
    .meta {
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .question {
      white-space: pre-wrap;
      font-size: clamp(19px, 2.1vw, 27px);
      line-height: 1.34;
      margin: 0 0 18px;
    }
    .answers { display: grid; gap: 10px; }
    .answer {
      min-height: 52px;
      padding: 11px 13px;
      text-align: left;
      white-space: normal;
      line-height: 1.35;
      background: #fbfcfd;
    }
    .answer.correct { border-color: var(--good); background: #ecfdf3; color: var(--good); }
    .answer.wrong { border-color: var(--bad); background: #fef3f2; color: var(--bad); }
    .feedback { min-height: 28px; margin-top: 12px; font-weight: 700; }
    .feedback.good { color: var(--good); }
    .feedback.bad { color: var(--bad); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .side { padding: 14px; align-self: start; }
    .side h2 { margin: 0 0 10px; font-size: 18px; }
    .row { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 10px 0; }
    @media (max-width: 840px) {
      .top, main, .toolbar { grid-template-columns: 1fr; }
      .pills { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1>ГОС 2025 тест с вариантами</h1>
      <div class="pills">
        <span class="pill" id="total"></span>
        <span class="pill" id="stage1"></span>
        <span class="pill" id="stage2"></span>
      </div>
    </div>
  </header>
  <main>
    <section>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Поиск по вопросу или ответу">
        <select id="stage">
          <option value="all">Оба этапа</option>
          <option value="1 этап">1 этап</option>
          <option value="2 этап">2 этап</option>
        </select>
        <button id="shuffle">Перемешать</button>
        <button id="reset">Сброс</button>
      </div>
      <article class="quiz">
        <div class="meta"><span id="pos"></span><span id="source"></span></div>
        <p class="question" id="question"></p>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button id="prev">Назад</button>
          <button class="primary" id="next">Дальше</button>
          <button id="show">Показать ответ</button>
        </div>
      </article>
    </section>
    <aside class="side">
      <h2>Прогресс</h2>
      <div class="row"><span>Верно</span><strong id="right">0</strong></div>
      <div class="row"><span>Ошибки</span><strong id="wrong">0</strong></div>
      <div class="row"><span>Показано</span><strong id="seen">0</strong></div>
      <div class="row"><span>Варианты из базы</span><strong>202</strong></div>
    </aside>
  </main>
  <script>
    const DATA = {"cards": [{"id": 1, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Укажите с помощью какого инструмента уменьшается отрицательное влияние рассеянного излучения рентгеновских лучей?", "answer": "отсеивающей решетки", "options": ["Ответ: Возрастная норма.", "Образование левого надпочечника", "отсеивающей решетки", "ПЭТ-КТ"], "correct_index": 2, "generated_options": true}, {"id": 2, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Определите наиболее характерные рентгенологические признаки язвы желудка и 12-перстной кишки:", "answer": "Симптом «ниша» на контуре слизистой оболочки", "options": ["МРТ с контрастированием", "Симптом «ниша» на контуре слизистой оболочки", "Уменьшены за счет правой доли", "Перелом наружной стенки правой орбиты, перелом височной кости справа"], "correct_index": 1, "generated_options": true}, {"id": 3, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Ребенок 13 лет. На рентгенограммах нижней трети бедренной кости справа в двух проекциях с захватом проксимального отдела костей голени на уровне дистального метафиза и эпифиза бедренной кости визуализируется линия поперечного просветления с четкими, ровными контурами. Признаков смещения метафиза по отношению к эпифизу не выявлено. Ваше заключение:", "answer": "Зона роста", "options": ["УЗИ плевральных полостей", "Зона роста", "Аномалия Арнольда – Киари I тип", "Средний отит"], "correct_index": 1, "generated_options": true}, {"id": 4, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Пациент А., 10 лет. Со слов мамы ребёнка периодически беспокоят боли в правой поясничной области. Было проведено УЗИ почек, после которого рекомендовано было пройти экскреторную урографию. Выберите верное заключение:", "answer": "Гетеролатеральная (перекрёстная) поясничная дистопия левой почки", "options": ["Ответ: Острая кишечная непроходимость.", "конкремент в устье мочеточника", "Ответ: Полисегментарная пневмония нижней доли левого лёгкого.", "Гетеролатеральная (перекрёстная) поясничная дистопия левой почки"], "correct_index": 3, "generated_options": true}, {"id": 5, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Назовите рентгенологический признак, характерный для туберкулезного инфильтрата?", "answer": "Затемнением с нечетким контуром и очагами отсева", "options": ["Затемнением с нечетким контуром и очагами отсева", "Опухоли поджелудочной железы", "Инфузионная экскреторная урография", "Хондроматоз"], "correct_index": 0, "generated_options": true}, {"id": 6, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Назовите наиболее значимый рентгенологический признак санированной туберкулезной каверны?", "answer": "Толщина стенки каверны", "options": ["Синдром Крузона", "Тромбоз средней мозговой артерии", "Острый холецистит", "Толщина стенки каверны"], "correct_index": 3, "generated_options": true}, {"id": 7, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Пациент Л., 62 лет. Жалобы на выраженные боли в поясничном отделе с иррадиацией в живот, таз; повышение температуры тела. Проведена рентгенография поясничного отдела позвоночника. Выберите верное заключение:", "answer": "Туберкулёзный спондилит", "options": ["Туберкулёзный спондилит", "2-95%", "больше снимаемого объекта", "Опухоли поджелудочной железы"], "correct_index": 0, "generated_options": true}, {"id": 8, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Назовите наиболее правильную методику проведения релаксационной фарингографии?", "answer": "медикаментозная релаксация мышц, введение рентгенконтрастного вещества, рентгеноскопия и рентгенография.", "options": ["по Резе", "гипокинез стенки", "Зона роста", "медикаментозная релаксация мышц, введение рентгенконтрастного вещества, рентгеноскопия и рентгенография."], "correct_index": 3, "generated_options": true}, {"id": 9, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Назовите положение пациента, при котором проводится латероскопия?", "answer": "при горизонтальном положении пациента и горизонтальном ходе лучей", "options": ["при горизонтальном положении пациента и горизонтальном ходе лучей", "Кортикальный нефрокальциноз", "при расположении объекта на середине расстояния фокус-пленка", "В забрюшинных лимфоузлах"], "correct_index": 0, "generated_options": true}, {"id": 10, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Назовите разветвление каких структурных единиц является основой сегментарного строения легкого?", "answer": "легочных артерий и бронхов", "options": ["Средний отит", "Пневмоторакс", "Аневризма интраренального отдела брюшной аорты", "легочных артерий и бронхов"], "correct_index": 3, "generated_options": true}, {"id": 11, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Назовите отличительный признак, характерный для структуры тени туберкулемы в фазе обострения?", "answer": "Наличием деструкции", "options": ["Наличием деструкции", "Фибромиомы матки", "Дермоидная киста", "Анэхогенной зоной с толстой капсулой и внутриполостной взвесью"], "correct_index": 0, "generated_options": true}, {"id": 12, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "Пациент С., 1974 г.р. в течение длительного времени находится на Д-учете у ревматолога. Беспокоит боль, припухлость, повышение температуры в области пораженных суставов. Выберите верное заключение для проведенной рентгенограммы кистей рук:", "answer": "Ревматоидный артрит суставов кистей, 4 ст. Коллапс запястий", "options": ["Эхинококковая киста печени", "перелом нижней трети плечевой кости", "Мочевыводящей системой", "Ревматоидный артрит суставов кистей, 4 ст. Коллапс запястий"], "correct_index": 3, "generated_options": true}, {"id": 13, "stage": "1 этап", "source": "Гос 1 этап 2025.docx", "question": "В какой проекции необходимо провести рентгенологическое исследование черепа пациенту с подозрением на невриному правого зрительного нерва?", "answer": "по Резе", "opt     const cards = DATA.cards;

    let index = 0;
    let progress = JSON.parse(localStorage.getItem("gosMcqTrainerProgress") || "{}");
    const $ = id => document.getElementById(id);
    const save = () => localStorage.setItem("gosMcqTrainerProgress", JSON.stringify(progress));
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }
    function rebuild() {
      const term = $("search").value.trim().toLowerCase();
      const stage = $("stage").value;
      order = cards.map((c, i) => [c, i])
        .filter(([c]) => stage === "all" || c.stage === stage)
        .filter(([c]) => !term || c.question.toLowerCase().includes(term) || c.answer.toLowerCase().includes(term))
        .map(([, i]) => i);
      index = Math.min(index, Math.max(0, order.length - 1));
      render();
    }
    function renderStats() {
      $("total").textContent = `${DATA.stats.total} вопросов`;
      $("stage1").textContent = `1 этап: ${DATA.stats.stage1}`;
      $("stage2").textContent = `2 этап: ${DATA.stats.stage2}`;
      let right = 0, wrong = 0, seen = 0;
      for (const card of cards) {
        const p = progress[card.id];
        if (!p) continue;
        if (p.seen) seen++;
        right += p.right || 0;
        wrong += p.wrong || 0;
      }
      $("right").textContent = right;
      $("wrong").textContent = wrong;
      $("seen").textContent = seen;
    }
    function render() {
      renderStats();
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      $("answers").innerHTML = "";
      if (!order.length) {
        $("pos").textContent = "0 / 0";
        $("source").textContent = "";
        $("question").textContent = "Нет вопросов для выбранного фильтра";
        return;
      }
      const card = cards[order[index]];
      $("pos").textContent = `${index + 1} / ${order.length}`;
      $("source").textContent = `${card.stage}`;
      $("question").textContent = card.question;
      card.options.forEach((option, optionIndex) => {
        const btn = document.createElement("button");
        btn.className = "answer";
        btn.textContent = option;
        btn.onclick = () => choose(optionIndex);
        $("answers").appendChild(btn);
      });
    }
    function choose(optionIndex) {
      if (!order.length) return;
      const card = cards[order[index]];
      const buttons = [...document.querySelectorAll(".answer")];
      buttons.forEach((button, i) => {
        if (i === card.correct_index) button.classList.add("correct");
        if (i === optionIndex && i !== card.correct_index) button.classList.add("wrong");
      });
      const p = progress[card.id] || { right: 0, wrong: 0, seen: false };
      p.seen = true;
      if (optionIndex === card.correct_index) {
        p.right = (p.right || 0) + 1;
        $("feedback").textContent = "Верно";
        $("feedback").className = "feedback good";
      } else {
        p.wrong = (p.wrong || 0) + 1;
        $("feedback").textContent = `Неверно. Правильный ответ: ${card.answer}`;
        $("feedback").className = "feedback bad";
      }
      progress[card.id] = p;
      save();
      renderStats();
    }
    $("show").onclick = () => {
      if (!order.length) return;
      const card = cards[order[index]];
      [...document.querySelectorAll(".answer")].forEach((button, i) => {
        if (i === card.correct_index) button.classList.add("correct");

      const p = progress[card.id] || { right: 0, wrong: 0, seen: false };
      p.seen = true;
      progress[card.id] = p;
      save();
      renderStats();
    };
    $("next").onclick = () => { if (order.length) { index = (index + 1) % order.length; render(); } };

    $("shuffle").onclick = () => { shuffleArray(order); index = 0; render(); };
    $("reset").onclick = () => { progress = {}; save(); render(); };
    $("search").oninput = rebuild;

    rebuild();
